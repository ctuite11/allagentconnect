name: Schema Drift Check

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'docs/database/schema_snapshot.sql'

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Check schema drift
        env:
          # Add these as GitHub repository secrets:
          #   DATABASE_URL — full postgres connection string to your Supabase DB
          # Example: postgresql://postgres.[ref]:[password]@aws-0-us-east-1.pooler.supabase.com:6543/postgres
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
        run: bash scripts/check-schema-drift.sh
