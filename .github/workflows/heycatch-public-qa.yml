name: Heycatch public website QA

on:
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "public/**"
      - "scripts/qa/**"
      - ".github/workflows/heycatch-public-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund
      - name: Build production bundle (no deploy or email)
        run: npm run build
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Run public pages locally in preview mode
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/aac-heycatch-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/qa/heycatch-public-smoke.mjs
