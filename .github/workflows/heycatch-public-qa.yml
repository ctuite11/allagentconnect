name: Heycatch public website QA

on:
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "public/**"
      - "scripts/qa/**"
      - ".github/workflows/heycatch-public-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund
      - name: Install Vitest DOM peer dependency
        run: npm install --no-save --no-package-lock --legacy-peer-deps --no-audit --no-fund @testing-library/dom
      - name: Test agent search price-range regressions
        run: npx vitest run src/lib/filterByPricePerSqft.test.ts src/lib/agentListingSearchDefaults.test.ts
      - name: Test first-publication Days on Market
        run: npx vitest run src/lib/listingDaysOnMarket.test.ts
      - name: Validate unique initial HTML metadata for public pages
        run: node --experimental-strip-types scripts/qa/heycatch-public-seo.mjs
      - name: Build production bundle (no deploy or email)
        env:
          # Safe public placeholders for CI. No backend, data, or credentials connected.
          VITE_SUPABASE_URL: "https://example.supabase.co"
          VITE_SUPABASE_ANON_KEY: "test-public-key-placeholder"
        run: npm run build
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Run public pages locally in preview mode
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/aac-heycatch-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/qa/heycatch-public-smoke.mjs
