name: Deploy Supabase Migration

on:
  push:
    branches:
      - migration
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'scripts/migration/**'
      - '.github/workflows/deploy-supabase-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migration-kwfqjnepesiihjkdnxou
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/migration' && github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the migration commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js for the existing safety checks
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Run offline outbound safety checks
        run: npm run migration:test

      - name: Verify the new database no-contact lock
        env:
          VITE_SUPABASE_URL: https://kwfqjnepesiihjkdnxou.supabase.co
          VITE_SUPABASE_PROJECT_ID: kwfqjnepesiihjkdnxou
          VITE_SUPABASE_ANON_KEY: ${{ secrets.MIGRATION_SUPABASE_ANON_KEY }}
          VITE_MIGRATION_OUTBOUND_DISABLED: 'true'
          VITE_MIGRATION_RELEASE_APPROVED: 'false'
        run: |
          node --input-type=module <<'JS'
          import { verifyDestinationLock } from './scripts/migration/check-destination-lock.mjs';
          await verifyDestinationLock(process.env);
          console.log('Destination database no-contact checks passed.');
          JS

      - name: Install the official Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Set migration pause flags in the new project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.MIGRATION_SUPABASE_ACCESS_TOKEN }}
        run: |
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo '::error::Add the MIGRATION_SUPABASE_ACCESS_TOKEN repository secret.'
            exit 1
          fi
          supabase secrets set \
            --project-ref kwfqjnepesiihjkdnxou \
            MIGRATION_OUTBOUND_DISABLED=true \
            MIGRATION_RELEASE_APPROVED=false \
            EMAIL_SENDING_PAUSED=true \
            HOT_SHEET_EMAILS_PAUSED=true \
            COMMS_EMAILS_PAUSED=true \
            DEVELOPMENT_EMAILS_PAUSED=true \
            SOCIAL_LAUNCH_OPEN=false

      - name: Deploy patched Edge Functions to the new project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.MIGRATION_SUPABASE_ACCESS_TOKEN }}
        run: >-
          supabase functions deploy
          --project-ref kwfqjnepesiihjkdnxou
          --use-api
          --jobs 3

      - name: List deployed functions without invoking workers
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.MIGRATION_SUPABASE_ACCESS_TOKEN }}
        run: supabase functions list --project-ref kwfqjnepesiihjkdnxou
