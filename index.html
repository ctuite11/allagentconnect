    <!-- Homepage Manrope: discover from initial HTML (same family/weights as HomepageV2).
         Inter/Poppins: needed for app chrome (body/h* in index.css). On / we defer them
         until after load/idle; non-home routes keep an immediate stylesheet. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
    (function () {
      var path = (location.pathname || "/").replace(/\/+$/, "") || "/";
      var isHome = path === "/" || path === "/index" || path === "/homepage-v2";
      var INTER_POPPINS =
        "https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap";
      var MANROPE =
        "https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap";

      function injectStylesheet(href, blocking) {
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = href;
        if (!blocking) {
          link.media = "print";
          link.onload = function () {
            this.media = "all";
          };
        }
        document.head.appendChild(link);
      }

      if (isHome) {
        // Immediate — do not wait for React/Helmet; this is the homepage LCP text face.
        injectStylesheet(MANROPE, true);
      }

      if (!isHome) {
        injectStylesheet(INTER_POPPINS, true);
        return;
      }

      function schedule(fn) {
        if (typeof window.requestIdleCallback === "function") {
          window.requestIdleCallback(fn, { timeout: 2500 });
        } else {
          setTimeout(fn, 1);
        }
      }

      function loadHomeFonts() {
        injectStylesheet(INTER_POPPINS, false);
      }

      if (document.readyState === "complete") schedule(loadHomeFonts);
      else window.addEventListener("load", function () { schedule(loadHomeFonts); });
    })();
    </script>

        "object-fit:cover;object-position:55% center;display:block;}";
      document.head.appendChild(style);
      document.documentElement.classList.add("aac-home-hero-shell");
    })();
    </script>

    <!-- Sync: mount shell before deferred module JS so LCP can paint during SPA boot. -->
    <script>
    (function () {
      var path = (location.pathname || "/").replace(/\/+$/, "") || "/";
      if (path !== "/" && path !== "/index" && path !== "/homepage-v2") return;
      // DCMLS consumer homepage must not inherit the AAC LCP hero shell.
      var host = (location.hostname || "").toLowerCase();
      var isLiveDcmls =
        host === "directconnectmls.com" || host === "www.directconnectmls.com";
      var isAacProduction =
        host === "allagentconnect.com" || host === "www.allagentconnect.com";
      var params = new URLSearchParams(location.search || "");
      var previewOverride =
        !isAacProduction &&
        !isLiveDcmls &&
        params.get("dcmls") === "1" &&
        (host === "localhost" ||
          host === "127.0.0.1" ||
          host === "[::1]" ||
          host.indexOf(".localhost", host.length - 10) !== -1 ||
          host.slice(-12) === ".netlify.app" ||
          host.slice(-12) === ".lovable.app" ||
          host.slice(-19) === ".lovableproject.com");
      if (isLiveDcmls || previewOverride) return;
      if (document.getElementById("aac-home-hero-shell")) return;

      var SRCSET =
        "/images/home/hero-768.webp 768w, /images/home/hero-1200.webp 1200w, /images/home/hero-1920.webp 1920w";
      var SIZES = "100vw";
      // Default src must be a WebP candidate (same family as srcset) so modern
      // browsers do not also fetch the JPEG fallback alongside the selected WebP.
      var SRC = "/images/home/hero-768.webp";

      var shell = document.createElement("div");
      shell.id = "aac-home-hero-shell";
      shell.setAttribute("aria-hidden", "true");
      var img = document.createElement("img");
      img.src = SRC;
      img.srcset = SRCSET;
      img.sizes = SIZES;
      img.alt = "";
      img.width = 1920;
      img.height = 1080;
      img.decoding = "async";
      img.setAttribute("fetchpriority", "high");
      shell.appendChild(img);
      document.body.appendChild(shell);
    })();
    </script>
