[build]
  command = "npm run build"
  publish = "dist"

# SPA + Netlify rewrite: every route returns index.html. Without strict cache limits,
# Netlify Edge can serve stale HTML (cache-status: fwd=stale) that still references an
# old hashed JS bundle — users then never load new app code until the shell revalidates.
# Hashed files under /assets/* are overridden below with long immutable cache.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "all"
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
    Netlify-CDN-Cache-Control = "no-store"

# Vite build output — safe to cache forever; new deploys get new filenames.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Favicon - no caching to ensure Google picks up updates
[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Canonical OG image - no long-term caching so social scrapers can refresh
[[headers]]
  for = "/og/aac-og-2026-01-22.jpg"
  [headers.values]
    Content-Type = "image/jpeg"
    Cache-Control = "public, max-age=0, must-revalidate"

# Versioned OG images - immutable caching is fine
[[headers]]
  for = "/og/aac-og-v*.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=31536000, immutable"

# Email assets (logos, monograms) - long-lived cache so mailbox image proxies
# (Gmail, Yahoo) cache the asset instead of refetching every render.
[[headers]]
  for = "/email/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/sitemap.xml"
  to = "https://qocduqtfbsevnhlgsfka.supabase.co/functions/v1/sitemap"
  status = 200

[[edge_functions]]
  path = "/property/*"
  function = "social-preview"

[[edge_functions]]
  path = "/api/auth/request-password-reset"
  function = "request-password-reset"

# Activation: same-origin POST endpoints for the AAC-owned activation token.
# The token travels in the POST body only — never a query string.
[[redirects]]
  from = "/api/activate-redeem"
  to = "/.netlify/functions/activate-redeem"
  status = 200
  force = true

[[redirects]]
  from = "/api/activate-resend"
  to = "/.netlify/functions/activate-resend"
  status = 200
  force = true

# Sign-in links: same-origin POST endpoint for the AAC-owned login token.
# The token travels in the POST body only — never a query string.
[[redirects]]
  from = "/api/login-redeem"
  to = "/.netlify/functions/login-redeem"
  status = 200
  force = true

[[redirects]]
  from = "/api/send-pending-approval-email"
  to = "/.netlify/functions/send-pending-approval-email"
  status = 200

[[redirects]]
  from = "/api/send-password-changed-email"
  to = "/.netlify/functions/send-password-changed-email"
  status = 200

# Functions configuration
[functions]
  node_bundler = "esbuild"

# Email queue is drained solely by Supabase process-email-queue (+ kick-email-queue).
# Netlify email-worker duplicated stale templates and raced the Supabase worker.
# [functions."email-worker"]
#   schedule = "* * * * *"

[[redirects]]
  from = "/api/showing-requests"
  to = "/.netlify/functions/showing-requests"
  status = 200

[[redirects]]
  from = "/api/attom-health"
  to = "/.netlify/functions/attom-health"
  status = 200

[[redirects]]
  from = "/api/attom-property-enrichment"
  to = "/.netlify/functions/attom-property-enrichment"
  status = 200

[[redirects]]
  from = "/api/aac-sync-listing"
  to = "/.netlify/functions/aac-sync-listing"
  status = 200

# SPA fallback (MUST be last — all client routes fall through to React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
